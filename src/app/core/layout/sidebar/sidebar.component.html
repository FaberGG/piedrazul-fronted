<aside class="sidebar">
  <div class="sidebar__logo">
    <img
      [src]="collapsed ? verticalLogo : horizontalLogo"
      alt="Logo de la aplicación"
      class="sidebar__logo-img"
    />
    <button
      type="button"
      class="sidebar__collapse-toggle"
      (click)="emitToggleSidebar()"
      [attr.aria-label]="collapsed ? 'Expandir sidebar' : 'Colapsar sidebar'"
      [attr.aria-expanded]="!collapsed"
    >
      <i [class]="collapsed ? 'fa-solid fa-angles-right' : 'fa-solid fa-angles-left'" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="sidebar__nav" aria-label="Menu principal">
    @for (item of visibleItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="sidebar__link"
      >
        <i [class]="item.iconClass + ' sidebar__icon'" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer" aria-label="Menu secundario">
    @for (item of utilityItems; track item.label) {
      <a [routerLink]="item.path" class="sidebar__link sidebar__link--utility">
        <i [class]="item.iconClass + ' sidebar__icon'" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    }

    <button type="button" class="sidebar__link sidebar__link--button" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket sidebar__icon" aria-hidden="true"></i>
      <span>Cerrar sesion</span>
    </button>
  </div>
</aside>
