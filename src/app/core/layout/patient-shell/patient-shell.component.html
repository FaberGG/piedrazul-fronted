<div class="patient-shell">
  <header class="patient-shell__header">
    <div class="patient-shell__brand">
      <div class="patient-shell__logo-mark">PZ</div>
      <div>
        <span class="patient-shell__brand-name">Piedrazul</span>
        <span class="patient-shell__brand-sub">Portal Paciente</span>
      </div>
    </div>

    <nav class="patient-shell__nav" aria-label="Navegación del paciente">
      <a routerLink="/paciente/agendar"   routerLinkActive="patient-shell__nav-link--active" class="patient-shell__nav-link">
        <i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>
        Agendar cita
      </a>
      <a routerLink="/paciente/mis-citas" routerLinkActive="patient-shell__nav-link--active" class="patient-shell__nav-link">
        <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
        Mis citas
      </a>
      <a routerLink="/paciente/perfil"    routerLinkActive="patient-shell__nav-link--active" class="patient-shell__nav-link">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        Mi perfil
      </a>
    </nav>

    <div class="patient-shell__profile">
      @if (authService.currentUser(); as user) {
        <span class="patient-shell__user-name">
          {{ user.nombreCompleto || user.username }}
        </span>
      }
      <button type="button" class="patient-shell__logout" (click)="authService.logout()">
        <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="patient-shell__content">
    <router-outlet />
  </main>
</div>
