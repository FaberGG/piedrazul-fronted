<header class="topbar">
  <div class="topbar__section">
    <h1 class="topbar__title">{{ sectionTitle() }}</h1>
    <p class="topbar__description">{{ sectionDescription() }}</p>
  </div>

  <div class="topbar__profile">
    <button
      type="button"
      class="topbar__profile-button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Menú de perfil"
    >
      <div class="topbar__avatar" aria-hidden="true">{{ userInitials() }}</div>

      <div class="topbar__user">
        <strong class="topbar__name">{{ authService.currentUser()?.nombreCompleto || 'Usuario' }}</strong>
        <span class="topbar__email" *ngIf="userEmail()">{{ userEmail() }}</span>
      </div>

      <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
    </button>

    <div class="topbar__menu" *ngIf="isMenuOpen()" role="menu">
      <button
        type="button"
        class="topbar__menu-item topbar__menu-item--logout"
        (click)="handleLogout()"
        role="menuitem"
      >
        <i class="fa-solid fa-sign-out-alt" aria-hidden="true"></i>
        Cerrar sesión
      </button>
    </div>
  </div>
</header>
