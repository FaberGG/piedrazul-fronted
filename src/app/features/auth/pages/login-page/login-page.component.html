<div class="login-page">

  <div class="login-page__card">

    <!-- Brand -->
    <div class="login-page__brand">
      <div class="login-page__logo-mark">PZ</div>
      <h1 class="login-page__brand-name">Piedrazul</h1>
      <p class="login-page__tagline">Sistema de agendamiento de citas</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-page__form">

      <div class="login-page__field">
        <label for="username" class="login-page__label">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="login-page__input"
          placeholder="Ingresa tu nombre de usuario"
          autocomplete="username"
        />
      </div>

      <div class="login-page__field">
        <label for="password" class="login-page__label">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="login-page__input"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        />
      </div>

      @if (errorMessage()) {
        <div class="login-page__error" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          {{ errorMessage() }}
        </div>
      }

      <button
        type="submit"
        class="login-page__submit"
        [disabled]="form.invalid || isLoading()"
      >
        @if (isLoading()) {
          <span class="login-page__spinner" aria-hidden="true"></span>
          Ingresando…
        } @else {
          Iniciar sesión
        }
      </button>

    </form>

    <!-- Register link -->
    <p class="login-page__register-hint">
      ¿No tienes cuenta?
      <button type="button" class="login-page__register-btn" (click)="goToRegister()">
        Regístrate
      </button>
    </p>

  </div>

  <!-- Minimal footer -->
  <footer class="login-page__footer">
    <span class="login-page__status">
      <span class="login-page__status-dot" aria-hidden="true"></span>
      Sistema activo
    </span>
    <span>© 2025 Piedrazul</span>
  </footer>

</div>
